# Mantiene checkin.aixensoft.com activo (evita cold start en hosting con sleep por inactividad).
name: Keepalive checkin.aixensoft.com

on:
  schedule:
  - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive-checkin
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping pasarela (HEAD)
        run: |
          curl -fsS --max-time 45 -I "https://checkin.aixensoft.com/" \
            -H "User-Agent: Aixensoft-Keepalive/1.0 (+ssl.aixensoft.com)"

      - name: Ping respaldo (GET raíz)
        run: |
          curl -fsS --max-time 45 "https://checkin.aixensoft.com/" \
            -H "User-Agent: Aixensoft-Keepalive/1.0 (+ssl.aixensoft.com)" \
            -o /dev/null