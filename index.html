<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://polygon-rpc.com https://rpc-mainnet.matic.quiknode.pro https://api.web3forms.com https://checkin.aixensoft.com; object-src 'none'; base-uri 'self';">
  <meta name="description" content="Certificados SSL/TLS sin validación OV — Aixensoft. Pago USDC/USDT en Polygon. Entrega en menos de 6 horas.">
  <title>Aixensoft SSL / TLS</title>
  <style>
    :root {
      --bg: #060b14;
      --card: #0d1524;
      --border: #1e2d47;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --emerald: #10b981;
      --cyan: #38bdf8;
      --emerald-dim: rgba(16, 185, 129, 0.15);
      --cyan-dim: rgba(56, 189, 248, 0.12);
      --danger: #f87171;
      --radius: 12px;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(56, 189, 248, 0.08), transparent),
        radial-gradient(ellipse 60% 40% at 100% 50%, rgba(16, 185, 129, 0.06), transparent);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    body.modal-open { overflow: hidden; }

    a { color: var(--cyan); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .wrap { max-width: 1120px; margin: 0 auto; padding: 0 1.25rem; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(6, 11, 20, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 0;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .brand { font-weight: 700; font-size: 1.05rem; letter-spacing: -0.02em; }
    .brand span { color: var(--emerald); }

    .lang-switch {
      display: flex;
      gap: 0.35rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.2rem;
    }

    .lang-switch button {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .lang-switch button.active {
      background: var(--emerald-dim);
      color: var(--emerald);
    }

    .support-strip {
      border-bottom: 1px solid var(--border);
      padding: 0.65rem 0;
      font-size: 0.9rem;
      background: linear-gradient(90deg, var(--card) 0%, rgba(13, 21, 36, 0.6) 100%);
    }

    .support-strip-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      color: var(--muted);
    }

    .btn-copy, .btn-icon-copy {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--cyan);
      padding: 0.35rem 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .hero { padding: 3.5rem 0 2.5rem; text-align: center; }

    .badge {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--emerald);
      background: var(--emerald-dim);
      border: 1px solid rgba(16, 185, 129, 0.35);
      padding: 0.4rem 1rem;
      border-radius: 999px;
      margin-bottom: 1.25rem;
    }

    .hero h1 {
      font-size: clamp(1.75rem, 4vw, 2.65rem);
      line-height: 1.2;
      margin: 0 0 1rem;
      font-weight: 800;
    }

    .hero .subtitle { max-width: 720px; margin: 0 auto; color: var(--muted); font-size: 1.05rem; }

    .plans-section h2, .how-section h2 {
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 2rem;
    }

    .plans-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .plan-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .plan-card.featured {
      border-color: var(--emerald);
      box-shadow: 0 0 0 1px rgba(16, 185, 129, 0.25), 0 12px 40px rgba(0, 0, 0, 0.35);
    }

    .plan-tag {
      position: absolute;
      top: -0.65rem;
      left: 50%;
      transform: translateX(-50%);
      background: var(--emerald);
      color: #042f1e;
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      padding: 0.25rem 0.85rem;
      border-radius: 999px;
    }

    .plan-desc {
      font-size: 0.88rem;
      color: var(--muted);
      font-style: italic;
      margin: 0.5rem 0 0.75rem;
      line-height: 1.45;
    }

    .unit-price {
      font-size: 0.95rem;
      color: var(--cyan);
      font-weight: 600;
      margin: 0;
    }

    .plan-total {
      font-size: 2rem;
      font-weight: 800;
      color: var(--cyan);
      margin: 0.35rem 0 0.75rem;
    }

    .qty-block {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.85rem;
      margin-bottom: 1rem;
    }

    .qty-label { font-size: 0.82rem; color: var(--muted); margin-bottom: 0.5rem; display: block; }

    .qty-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.85rem;
    }

    .qty-btn {
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 1.25rem;
      font-weight: 700;
      cursor: pointer;
      line-height: 1;
    }

    .qty-btn:hover:not(:disabled) { border-color: var(--cyan); color: var(--cyan); }
    .qty-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .qty-value { font-size: 1.35rem; font-weight: 800; min-width: 2rem; text-align: center; }

    .plan-features {
      list-style: none;
      padding: 0;
      margin: 0 0 1.25rem;
      flex: 1;
      font-size: 0.88rem;
      color: var(--muted);
    }

    .plan-features li {
      padding: 0.35rem 0 0.35rem 1.25rem;
      position: relative;
    }

    .plan-features li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.6rem;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--emerald);
    }

    .btn-plan {
      width: 100%;
      border: none;
      background: linear-gradient(135deg, var(--emerald) 0%, #059669 100%);
      color: #042f1e;
      font-weight: 700;
      padding: 0.85rem;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .plan-card.featured .btn-plan {
      background: linear-gradient(135deg, var(--cyan) 0%, #0ea5e9 100%);
      color: #0c1929;
    }

    .how-section { padding: 3rem 0; border-top: 1px solid var(--border); }

    .steps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.25rem;
    }

    .step-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
    }

    .step-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2rem;
      border-radius: 8px;
      background: var(--cyan-dim);
      color: var(--cyan);
      font-weight: 800;
      margin-bottom: 0.75rem;
    }

    .step-card h3 { margin: 0 0 0.5rem; font-size: 1.05rem; }
    .step-card p { margin: 0; color: var(--muted); font-size: 0.9rem; }

    footer {
      border-top: 1px solid var(--border);
      padding: 2rem 0;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
    }

    footer .domain { color: var(--emerald); font-weight: 600; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(2, 6, 14, 0.78);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      width: 100%;
      max-width: 520px;
      max-height: 92vh;
      overflow-y: auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .modal-head h2 { margin: 0; font-size: 1.2rem; }
    .modal-summary { font-size: 0.85rem; color: var(--muted); margin-top: 0.35rem; }

    .btn-close {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--muted);
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.25rem;
    }

    .field { margin-bottom: 0.9rem; }
    .field label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem; }

    .field input, .field select, .field textarea {
      width: 100%;
      padding: 0.7rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
      font-family: inherit;
    }

    .field textarea { min-height: 72px; resize: vertical; }

    .field-hint, .domain-live-count { font-size: 0.8rem; color: var(--muted); margin-top: 0.3rem; }
    .domain-live-count.ok { color: var(--emerald); }
    .domain-live-count.bad { color: var(--danger); }

    .field-error { color: var(--danger); font-size: 0.8rem; margin-top: 0.3rem; min-height: 1em; }

    .hp-field {
      position: absolute;
      left: -9999px;
      opacity: 0;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }

    .token-picker { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; }

    .token-opt {
      flex: 1;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      padding: 0.65rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .token-opt.active { border-color: var(--emerald); background: var(--emerald-dim); color: var(--emerald); }

    .pay-panel {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      margin-top: 0.75rem;
      background: rgba(6, 11, 20, 0.5);
    }

    .pay-panel h3 { margin: 0 0 0.65rem; font-size: 0.95rem; }

    .pay-meta {
      font-size: 0.85rem;
      color: var(--muted);
      word-break: break-all;
      margin: 0.35rem 0;
    }

    .pay-meta strong { color: var(--text); }

    .btn-action {
      width: 100%;
      margin-top: 0.5rem;
      border: none;
      background: linear-gradient(135deg, var(--emerald) 0%, #059669 100%);
      color: #042f1e;
      font-weight: 800;
      padding: 0.85rem;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .btn-action:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--cyan);
    }

    .modal-status {
      margin-top: 0.75rem;
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.85rem;
      display: none;
    }

    .modal-status.visible { display: block; }
    .modal-status.error { background: rgba(248, 113, 113, 0.12); border: 1px solid rgba(248, 113, 113, 0.35); color: #fecaca; }
    .modal-status.success { background: var(--emerald-dim); border: 1px solid rgba(16, 185, 129, 0.35); color: #a7f3d0; }
    .modal-status.info { background: var(--cyan-dim); border: 1px solid rgba(56, 189, 248, 0.35); color: #bae6fd; }

    @media (max-width: 600px) {
      .hero { padding-top: 2rem; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="brand">Aixensoft <span>SSL / TLS</span></div>
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" id="langEs" class="active" aria-pressed="true">Español</button>
        <button type="button" id="langEn" aria-pressed="false">English</button>
      </div>
    </div>
  </header>

  <div class="support-strip">
    <div class="wrap support-strip-inner">
      <span id="supportLabel"></span>
      <a href="mailto:contact@aixensoft.com" rel="noopener noreferrer">contact@aixensoft.com</a>
      <button type="button" class="btn-copy" id="btnCopyEmail"></button>
    </div>
  </div>

  <main>
    <section class="hero wrap">
      <p class="badge" id="heroBadge"></p>
      <h1 id="heroTitle"></h1>
      <p class="subtitle" id="heroSubtitle"></p>
    </section>

    <section class="plans-section wrap">
      <h2 id="plansHeading"></h2>
      <div class="plans-grid">
        <article class="plan-card" data-plan="basic">
          <h3 class="plan-name" id="plan1Name"></h3>
          <p class="plan-desc" id="plan1Desc"></p>
          <p class="unit-price" id="plan1Unit"></p>
          <p class="plan-total" id="plan1Total">$39</p>
          <div class="qty-block">
            <span class="qty-label" id="qtyLabel1"></span>
            <div class="qty-controls">
              <button type="button" class="qty-btn" data-qty-minus="basic" aria-label="-">−</button>
              <span class="qty-value" id="qtyBasic" data-qty-display="basic">1</span>
              <button type="button" class="qty-btn" data-qty-plus="basic" aria-label="+">+</button>
            </div>
          </div>
          <ul class="plan-features" id="plan1Features"></ul>
          <button type="button" class="btn-plan" data-buy-plan="basic" id="btnPlan1"></button>
        </article>

        <article class="plan-card featured" data-plan="secure_site">
          <span class="plan-tag" id="plan2Tag"></span>
          <h3 class="plan-name" id="plan2Name"></h3>
          <p class="plan-desc" id="plan2Desc"></p>
          <p class="unit-price" id="plan2Unit"></p>
          <p class="plan-total" id="plan2Total">$180</p>
          <div class="qty-block">
            <span class="qty-label" id="qtyLabel2"></span>
            <div class="qty-controls">
              <button type="button" class="qty-btn" data-qty-minus="secure_site">−</button>
              <span class="qty-value" id="qtySecureSite" data-qty-display="secure_site">1</span>
              <button type="button" class="qty-btn" data-qty-plus="secure_site">+</button>
            </div>
          </div>
          <ul class="plan-features" id="plan2Features"></ul>
          <button type="button" class="btn-plan" data-buy-plan="secure_site" id="btnPlan2"></button>
        </article>

        <article class="plan-card" data-plan="secure_site_pro">
          <h3 class="plan-name" id="plan3Name"></h3>
          <p class="plan-desc" id="plan3Desc"></p>
          <p class="unit-price" id="plan3Unit"></p>
          <p class="plan-total" id="plan3Total">$290</p>
          <div class="qty-block">
            <span class="qty-label" id="qtyLabel3"></span>
            <div class="qty-controls">
              <button type="button" class="qty-btn" data-qty-minus="secure_site_pro">−</button>
              <span class="qty-value" id="qtySecureSitePro" data-qty-display="secure_site_pro">1</span>
              <button type="button" class="qty-btn" data-qty-plus="secure_site_pro">+</button>
            </div>
          </div>
          <ul class="plan-features" id="plan3Features"></ul>
          <button type="button" class="btn-plan" data-buy-plan="secure_site_pro" id="btnPlan3"></button>
        </article>
      </div>
    </section>

    <section class="how-section wrap">
      <h2 id="howHeading"></h2>
      <div class="steps-grid">
        <article class="step-card">
          <div class="step-num">1</div>
          <h3 id="step1Title"></h3>
          <p id="step1Text"></p>
        </article>
        <article class="step-card">
          <div class="step-num">2</div>
          <h3 id="step2Title"></h3>
          <p id="step2Text"></p>
        </article>
        <article class="step-card">
          <div class="step-num">3</div>
          <h3 id="step3Title"></h3>
          <p id="step3Text"></p>
        </article>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <p><span>ssl.aixensoft.com</span> · <span class="domain">Aixensoft</span></p>
      <p id="footerRights"></p>
      <p><a href="https://checkin.aixensoft.com" rel="noopener noreferrer" id="footerPayLink"></a></p>
    </div>
  </footer>

  <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <div>
          <h2 id="modalTitle"></h2>
          <p class="modal-summary" id="modalSummary"></p>
        </div>
        <button type="button" class="btn-close" id="modalClose" aria-label="Cerrar">×</button>
      </div>

      <form id="orderForm" novalidate>
        <section id="formStepDetails">
          <div class="field">
            <label for="email" id="labelEmail"></label>
            <input type="email" id="email" required maxlength="254" autocomplete="email">
            <div class="field-error" id="errEmail"></div>
          </div>

          <div class="field">
            <label for="domains" id="labelDomains"></label>
            <textarea id="domains" required maxlength="2048" autocomplete="off" spellcheck="false"></textarea>
            <p class="field-hint" id="domainsHelp"></p>
            <p class="domain-live-count" id="domainLiveCount"></p>
            <div class="field-error" id="errDomains"></div>
          </div>

          <div class="field">
            <label for="serverType" id="labelServer"></label>
            <select id="serverType">
              <option value="" id="optServerDefault"></option>
              <option value="iis" id="optServerIis"></option>
              <option value="nginx" id="optServerNginx"></option>
              <option value="apache" id="optServerApache"></option>
              <option value="cpanel" id="optServerCpanel"></option>
              <option value="exchange" id="optServerExchange"></option>
              <option value="other" id="optServerOther"></option>
            </select>
          </div>

          <div class="hp-field" aria-hidden="true">
            <label for="website">Website</label>
            <input type="text" id="website" tabindex="-1" autocomplete="off">
          </div>

          <button type="button" class="btn-action" id="btnContinuePay"></button>
        </section>

        <section id="formStepPayment" hidden>
          <p class="pay-meta" id="payAmountLine"></p>

          <div class="field">
            <span class="qty-label" id="labelToken"></span>
            <div class="token-picker" role="group" id="tokenPicker">
              <button type="button" class="token-opt active" data-token="USDC">USDC</button>
              <button type="button" class="token-opt" data-token="USDT">USDT</button>
            </div>
            <p class="field-hint" id="networkHint"></p>
          </div>

          <div class="pay-panel">
            <h3 id="optWalletTitle"></h3>
            <p class="field-hint" id="optWalletDesc"></p>
            <button type="button" class="btn-action" id="btnWalletPay"></button>
          </div>

          <div class="pay-panel">
            <h3 id="optManualTitle"></h3>
            <p class="pay-meta" id="manualWalletLine"></p>
            <button type="button" class="btn-icon-copy" id="btnCopyWallet"></button>
            <p class="pay-meta" id="manualAmountLine"></p>
            <div class="field">
              <label for="txHash" id="labelTxHash"></label>
              <input type="text" id="txHash" maxlength="66" autocomplete="off" spellcheck="false" placeholder="0x...">
            </div>
            <button type="button" class="btn-action btn-secondary" id="btnVerifyTx"></button>
          </div>

          <button type="button" class="btn-action btn-secondary" id="btnBackDetails"></button>
        </section>

        <div id="modalStatus" class="modal-status" role="status"></div>
      </form>
    </div>
  </div>

  <script>
    var POLYGON_ROUTER_CONFIG = {
      merchantWallet: "0x80bD7c5b58344d869c01D9d9c0AD62e632DCE839",
      web3FormsKey: "33072a16-8226-4102-8f7e-f9b7048bee36",
      keepAliveUrl: "https://checkin.aixensoft.com",
      rpcUrls: [
        "https://polygon-rpc.com",
        "https://rpc-mainnet.matic.quiknode.pro"
      ],
      tokens: {
        USDC: {
          address: "0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359",
          decimals: 6,
          symbol: "USDC"
        },
        USDT: {
          address: "0xc2132D05D31c914a87C6611C10748AEb04B58e8F",
          decimals: 6,
          symbol: "USDT"
        }
      }
    };

    var PLAN_CATALOG = {
      basic: { unitPrice: 39, totalEl: "plan1Total" },
      secure_site: { unitPrice: 180, totalEl: "plan2Total" },
      secure_site_pro: { unitPrice: 290, totalEl: "plan3Total" }

    function hasDangerousDomainInput(raw) {
      if (!raw) return true;
      var lower = raw.toLowerCase();
      if (/[\s;|&$`<>]/.test(raw)) return true;
      if (lower.indexOf("http://") !== -1 || lower.indexOf("https://") !== -1) return true;
      if (raw.indexOf("/") !== -1 || raw.indexOf("\\") !== -1) return true;
      return false;
    }

    function parseDomainsInput(raw) {
      return raw.split(",").map(function (s) { return s.trim(); }).filter(Boolean);
    }

    function validateEmail(email) {
      return !!(email && email.length <= 254 && EMAIL_REGEX.test(email));
    }

    function validateDomainsList(domainsRaw, expectedN) {
      var list = parseDomainsInput(domainsRaw);
      if (list.length !== expectedN) {
        return { ok: false, code: "errDomainCount", expected: expectedN };
      }
      for (var i = 0; i < list.length; i++) {
        if (hasDangerousDomainInput(list[i])) return { ok: false, code: "errDomainChars" };
        if (!DOMAIN_REGEX.test(list[i])) return { ok: false, code: "errDomainFormat" };
      }
      return { ok: true, domains: list };
    }

    function amountToBaseUnits(totalUsd) {
      return BigInt(totalUsd) * BigInt(1000000);

    function padHex64(hex) {
      var h = hex.replace(/^0x/, "").toLowerCase();
      while (h.length < 64) h = "0" + h;
      return h;
    }

    function encodeErc20Transfer(toWallet, amountBase) {
      var to = padHex64(toWallet);
      var amt = padHex64(amountBase.toString(16));
      return ERC20_TRANSFER_SELECTOR + to + amt;
    }

    function rpcCall(rpcUrl, method, params) {
      return fetch(rpcUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: method, params: params }),
        credentials: "omit"
      }).then(function (res) {
        if (!res.ok) throw new Error("rpc_http");
        return res.json();
      }).then(function (data) {
        if (data.error) throw new Error("rpc_err");
        return data.result;
      });
    }

    function verifyPolygonTransaction(txHash, expectedAmount, tokenAddress) {
      var merchant = getMerchantWallet().toLowerCase();
      var token = tokenAddress.toLowerCase();
      var expectedBase = amountToBaseUnits(expectedAmount);

      function tryRpc(index) {
        if (index >= POLYGON_ROUTER_CONFIG.rpcUrls.length) return Promise.resolve(false);
        var rpc = POLYGON_ROUTER_CONFIG.rpcUrls[index];
        return rpcCall(rpc, "eth_getTransactionReceipt", [txHash]).then(function (receipt) {
          if (!receipt || receipt.status !== "0x1") return false;
          var logs = receipt.logs || [];
          for (var i = 0; i < logs.length; i++) {
            var log = logs[i];
            if (!log.address || log.address.toLowerCase() !== token) continue;
            if (!log.topics || log.topics[0] !== TRANSFER_TOPIC) continue;
            if (log.topics.length < 3) continue;
            var toAddr = addressFromTopic(log.topics[2]);
            if (toAddr !== merchant) continue;
            var value = BigInt(log.data || "0x0");
            if (value >= expectedBase) return true;
          }
          return false;
        }).catch(function () {
          return tryRpc(index + 1);
        });
      }

      return tryRpc(0);
    }

      return fetch("https://api.web3forms.com/submit", {

          access_key: POLYGON_ROUTER_CONFIG.web3FormsKey,
          subject: "SSL Aixensoft — Pago Polygon verificado",
          from_name: "ssl.aixensoft.com",
          email: order.email,
          message: body
        }),
        credentials: "omit"
      }).then(function (res) {
        return res.json().then(function (data) {
          if (!res.ok || !data.success) throw new Error("web3forms_fail");
          return true;
        });
      });
    }

    function onPaymentSuccess(order, txHash) {
      var storageKey = "ssl_tx_notified_" + txHash.toLowerCase();
      if (sessionStorage.getItem(storageKey) === "1") {
        showModalStatus("success", t("statusEmailSent"));
        return Promise.resolve();
      }
      return submitOrderEmail(order, txHash).then(function () {
        sessionStorage.setItem(storageKey, "1");
        showModalStatus("success", t("statusEmailSent"));
      });
    }

    function processVerifiedPayment(txHash) {
      if (!orderSnapshot) return;
      showModalStatus("info", t("statusVerifying"));
      var tokenCfg = POLYGON_ROUTER_CONFIG.tokens[orderSnapshot.token];
      verifyPolygonTransaction(txHash, orderSnapshot.totalAmount, tokenCfg.address).then(function (ok) {
        if (!ok) {
          showModalStatus("error", t("errPayVerify"));
          return;
        }
        onPaymentSuccess(orderSnapshot, txHash);
      }).catch(function () {
        showModalStatus("error", t("errPayVerify"));
      });
    }

    function ensurePolygonChain(provider) {
      return provider.request({ method: "eth_chainId" }).then(function (chainId) {
        if (chainId === POLYGON_CHAIN_ID) return;
        return provider.request({
          method: "wallet_switchEthereumChain",
          params: [{ chainId: POLYGON_CHAIN_ID }]
        }).catch(function (err) {
          if (!err || err.code !== 4902) throw err;
          return provider.request({
            method: "wallet_addEthereumChain",
            params: [{
              chainId: POLYGON_CHAIN_ID,
              chainName: "Polygon PoS",
              nativeCurrency: { name: "MATIC", symbol: "MATIC", decimals: 18 },
              rpcUrls: POLYGON_ROUTER_CONFIG.rpcUrls
            }]
          }).then(function () {
            return provider.request({
              method: "wallet_switchEthereumChain",
              params: [{ chainId: POLYGON_CHAIN_ID }]
            });
          });
        });
      });
    }

    function payWithWallet() {
      if (Date.now() < payLockedUntil) return;
      if (!orderSnapshot) return;

      if (!window.ethereum) {
        showModalStatus("error", t("errNoWeb3"));
        return;
      }

      var provider = window.ethereum;
      var merchant = getMerchantWallet();
      if (!WALLET_REGEX.test(merchant)) {
        showModalStatus("error", t("errWalletConfig"));
        return;
      }

      var tokenCfg = POLYGON_ROUTER_CONFIG.tokens[orderSnapshot.token];
      var amountBase = amountToBaseUnits(orderSnapshot.totalAmount);
      var data = encodeErc20Transfer(merchant, amountBase);
      var btn = document.getElementById("btnWalletPay");

      startPayCooldown(btn);
      showModalStatus("info", t("statusWalletWait"));

      provider.request({ method: "eth_requestAccounts" })
        .then(function (accounts) {
          if (!accounts || !accounts.length) throw new Error("no_accounts");
          return ensurePolygonChain(provider).then(function () {
            return provider.request({
              method: "eth_sendTransaction",
              params: [{
                from: accounts[0],
                to: tokenCfg.address,
                data: data
              }]
            });
          });
        })
        .then(function (txHash) {
          if (!TX_HASH_REGEX.test(txHash)) throw new Error("bad_tx");
          processVerifiedPayment(txHash);
        })
        .catch(function () {
          showModalStatus("error", t("errPayVerify"));
        });
    }

    function verifyManualTx() {
      if (Date.now() < payLockedUntil) return;
      if (!orderSnapshot) return;
      var txHash = document.getElementById("txHash").value.trim();
      if (!TX_HASH_REGEX.test(txHash)) {
        showModalStatus("error", t("errTxHash"));
        return;
      }
      startPayCooldown(document.getElementById("btnVerifyTx"));
      processVerifiedPayment(txHash);
    }

    function pingCheckinGateway() {
      try {
        fetch(POLYGON_ROUTER_CONFIG.keepAliveUrl, { mode: "no-cors", cache: "no-store", credentials: "omit" });
      } catch (e) { /* silencioso */ }
    }

    document.getElementById("langEs").addEventListener("click", function () { applyLanguage("es"); });
    document.getElementById("langEn").addEventListener("click", function () { applyLanguage("en"); });

    document.getElementById("btnCopyEmail").addEventListener("click", function () {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(SUPPORT_EMAIL).then(function () {
          var btn = document.getElementById("btnCopyEmail");
          var prev = btn.textContent;
          btn.textContent = t("copyOk");
          setTimeout(function () { btn.textContent = prev; }, 2000);
        }).catch(function () { window.alert(t("copyFail")); });
      }
    });

    document.getElementById("btnCopyWallet").addEventListener("click", function () {
      var wallet = getMerchantWallet();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(wallet).then(function () {
          var btn = document.getElementById("btnCopyWallet");
          var prev = btn.textContent;
          btn.textContent = t("copyWalletOk");
          setTimeout(function () { btn.textContent = prev; }, 2000);
        });
      }
    });

    document.querySelectorAll("[data-qty-minus]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var plan = btn.getAttribute("data-qty-minus");
        if (planQty[plan] > QTY_MIN) {
          planQty[plan] -= 1;
          updatePlanPricing(plan);
        }
      });
    });

    document.querySelectorAll("[data-qty-plus]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var plan = btn.getAttribute("data-qty-plus");
        if (planQty[plan] < QTY_MAX) {
          planQty[plan] += 1;
          updatePlanPricing(plan);
        }
      });
    });

    document.querySelectorAll("[data-buy-plan]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        openModal(btn.getAttribute("data-buy-plan"));
      });
    });

    document.getElementById("domains").addEventListener("input", updateDomainLiveCount);

    document.getElementById("modalClose").addEventListener("click", closeModal);
    document.getElementById("modalBackdrop").addEventListener("click", function (ev) {
      if (ev.target === document.getElementById("modalBackdrop")) closeModal();
    });

    document.addEventListener("keydown", function (ev) {
      if (ev.key === "Escape") closeModal();
    });

    document.querySelectorAll(".token-opt").forEach(function (btn) {
      btn.addEventListener("click", function () {
        selectedToken = btn.getAttribute("data-token");
        document.querySelectorAll(".token-opt").forEach(function (b) {
          b.classList.toggle("active", b === btn);
        });
        refreshPaymentPanel();
        if (orderSnapshot) orderSnapshot.token = selectedToken;
      });
    });

    document.getElementById("btnContinuePay").addEventListener("click", function () {
      var order = validateOrderForm();
      if (!order) return;
      orderSnapshot = order;
      document.getElementById("formStepDetails").hidden = true;
      document.getElementById("formStepPayment").hidden = false;
      refreshPaymentPanel();
      hideModalStatus();
    });

    document.getElementById("btnBackDetails").addEventListener("click", function () {
      document.getElementById("formStepPayment").hidden = true;
      document.getElementById("formStepDetails").hidden = false;
      hideModalStatus();
    });

    document.getElementById("btnWalletPay").addEventListener("click", payWithWallet);
    document.getElementById("btnVerifyTx").addEventListener("click", verifyManualTx);

    document.getElementById("orderForm").addEventListener("submit", function (ev) {
      ev.preventDefault();
    });

    applyLanguage("es");
    pingCheckinGateway();
    setInterval(pingCheckinGateway, KEEP_ALIVE_MS);
  </script>
</body>
</html>
